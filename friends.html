<style>
        body {
            background-color: #fbf9f8;
            color: #1b1c1c;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .crystal-sphere {
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            aspect-ratio: 1/1;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            box-shadow: inset 0 0 40px rgba(255,255,255,0.5), 0 10px 30px rgba(90,90,90,0.05);
        }
        .crystal-sphere:hover {
            transform: scale(1.05) translateY(-8px);
        }
        .crystal-sphere::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 80%);
            border-radius: 50%;
            pointer-events: none;
        }
        .halo-pulse {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid rgba(98, 95, 80, 0.3);
            animation: halo-glow 3s infinite ease-in-out;
        }
        @keyframes halo-glow {
            0% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.08); opacity: 0.6; border-color: rgba(98, 95, 80, 0.6); }
            100% { transform: scale(1); opacity: 0.2; }
        }
        .notification-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .floating-fab {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
        }
        body {

        }
        .friend-card {
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s;
        }
        .friend-card.entering {

<script>
        function navigateToFriend(name, img) {
            // 缩放动画后跳转
            const card = event.currentTarget;
            card.classList.add('entering');
            setTimeout(() => {
                window.location.href = 'friend-world-detail.html?name=' + encodeURIComponent(name) + '&img=' + encodeURIComponent(img);
            }, 400);
        }

        // Soft parallax for desktop
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
                document.querySelectorAll('.crystal-sphere img').forEach(img => {
                    img.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
                });
            });
        }
</script>
