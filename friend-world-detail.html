<style>
        body {
            background-color: #fbf9f8;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .crystal-hero {
            position: relative;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(255,255,255,0.5), 0 20px 50px rgba(90,90,90,0.08);
        }
        .crystal-hero::after {
            content: '';
            position: absolute;
            top: 8%;
            left: 12%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 80%);
            border-radius: 50%;
            pointer-events: none;
        }
        .halo-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 2rem;
            border: 2px solid rgba(98, 95, 80, 0.2);
            animation: halo-breathe 4s infinite ease-in-out;
        }
        @keyframes halo-breathe {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.02); opacity: 0.4; }
        }
        .entry-card {
            animation: fadeInUp 0.5s ease both;
        }
        .entry-card:nth-child(1) { animation-delay: 0.1s; }
        .entry-card:nth-child(2) { animation-delay: 0.2s; }
        .entry-card:nth-child(3) { animation-delay: 0.3s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>

<body class="font-body-lg text-on-surface">
<!-- TopAppBar -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-surface/80 backdrop-blur-xl border-none">
<div class="flex items-center w-full px-margin-page py-4 max-w-[720px] mx-auto">
<a href="friends.html" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-primary/5 transition-colors active:scale-90">
<span class="material-symbols-outlined text-on-surface text-[22px]">arrow_back</span>
</a>
<h1 class="font-headline-md text-headline-md-mobile text-primary ml-3" id="page-title">好友世界</h1>
<div class="ml-auto flex items-center gap-3">
<button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-primary/5 transition-colors active:scale-90">
<span class="material-symbols-outlined text-on-surface text-[20px]">notifications</span>
</button>
<button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-primary/5 transition-colors active:scale-90">
<span class="material-symbols-outlined text-on-surface text-[20px]">share</span>
</button>
</div>
</div>
</nav>

<!-- Main Content -->
<main class="pt-24 pb-32 px-margin-page max-w-[720px] mx-auto min-h-screen">
<!-- Crystal Hero -->
<div class="relative mb-stack-lg">
<div class="halo-ring"></div>
<div class="crystal-hero w-full aspect-[4/3]">
<img id="crystal-img" class="w-full h-full object-cover" src="" alt="好友水晶球">
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
</div>

<!-- Friend Info -->
<section class="flex items-center gap-4 mb-stack-lg">
<div class="w-14 h-14 rounded-full overflow-hidden border-2 border-white shadow-md">
<img id="avatar-img" class="w-full h-full object-cover" src="" alt="">
</div>
<div class="flex-1">
<h2 class="font-headline-md text-on-surface" id="friend-name">好友</h2>
<p class="font-label-sm text-on-surface-variant/60" id="friend-world-label">的世界</p>
</div>
<button class="glass-card px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white/90 transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px] text-primary">auto_awesome</span>
<span class="font-label-sm text-primary">共鸣</span>
</button>
</section>

<!-- Stats -->
<div class="grid grid-cols-3 gap-gutter-grid mb-stack-lg">
<div class="glass-card p-4 rounded-lg text-center">
<span class="font-headline-md text-primary">18</span>
<span class="font-label-sm text-on-surface-variant/60 block">回忆</span>
</div>
<div class="glass-card p-4 rounded-lg text-center">
<span class="font-headline-md text-primary">7</span>
<span class="font-label-sm text-on-surface-variant/60 block">天更新</span>
</div>
<div class="glass-card p-4 rounded-lg text-center">
<span class="font-headline-md text-primary">92%</span>
<span class="font-label-sm text-on-surface-variant/60 block">共鸣度</span>
</div>
</div>

<!-- Recent Entries -->
<h3 class="font-headline-md-mobile text-on-surface mb-stack-sm">近期动态</h3>
<div class="space-y-stack-sm">
<!-- Entry 1 -->
<div class="entry-card glass-card p-5 rounded-lg">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[18px]">auto_awesome</span>
<span class="font-label-sm text-on-surface-variant/60">3小时前</span>
<span class="ml-auto text-[11px] text-primary bg-primary/10 px-2 py-0.5 rounded-full">平静</span>
</div>
<p class="font-body-diary text-on-surface leading-relaxed">"今天在雪山脚下散步，看到了最美的日落。那一刻，所有的疲惫都消散在金色的光芒中。"</p>
</div>
<!-- Entry 2 -->
<div class="entry-card glass-card p-5 rounded-lg">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[18px]">auto_awesome</span>
<span class="font-label-sm text-on-surface-variant/60">昨天</span>
<span class="ml-auto text-[11px] text-primary bg-primary/10 px-2 py-0.5 rounded-full">感恩</span>
</div>
<p class="font-body-diary text-on-surface leading-relaxed">"收到了一封来自远方的手写信，在这个数字化的时代，这样的温暖格外珍贵。"</p>
</div>
<!-- Entry 3 -->
<div class="entry-card glass-card p-5 rounded-lg">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[18px]">auto_awesome</span>
<span class="font-label-sm text-on-surface-variant/60">2天前</span>
<span class="ml-auto text-[11px] text-primary bg-primary/10 px-2 py-0.5 rounded-full">思念</span>
</div>
<p class="font-body-diary text-on-surface leading-relaxed">"窗外的雨声让我想起了去年这个时候的旅行。时间过得真快啊。"</p>
</div>
</div>
</main>

</nav>

<script>
        const params = new URLSearchParams(window.location.search);
        const friendName = params.get('name') || '好友的世界';
        const friendImg = params.get('img') || '';

        document.getElementById('page-title').textContent = friendName;
        document.getElementById('friend-name').textContent = friendName;
        document.getElementById('friend-world-label').textContent = '的世界';
        document.getElementById('crystal-img').src = friendImg;
        document.getElementById('avatar-img').src = friendImg;
        document.title = friendName + ' - Crystal Ball World';
</script>
