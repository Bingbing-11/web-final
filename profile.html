<script>
        // Simple micro-interaction for scroll depth awareness
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm', 'py-3');
                header.classList.remove('py-4');
            } else {
                header.classList.remove('shadow-sm', 'py-3');
                header.classList.add('py-4');
            }
        });

        // Add subtle hover effect for glass cards
        document.querySelectorAll('.glass-surface').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
